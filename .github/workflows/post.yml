name: Gerar posts (fila ou publicação)

on:
  schedule:
    # Horários em UTC (Manaus = UTC-4): 07h, 10h, 13h, 16h e 19h de Manaus
    - cron: "0 11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Máximo de posts nesta execução"
        required: false

concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Configurar git
        run: |
          git config user.name "amazonasemfato-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rodar o bot
        env:
          # MODE: "draft" = só gera card+legenda na fila (padrão) | "publish" = posta via API.
          # Para trocar, crie a variável MODE em Settings → Secrets and variables → Actions → Variables
          MODE: ${{ vars.MODE || 'draft' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || '' }}
        run: python -m bot.main
